openapi: 3.1.0
info:
  title: DocGen API
  version: 0.1.0
  description: Сервис генерации документов по шаблонам.

paths:
  /healthz:
    get:
      summary: Проверка живости сервиса
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/whoami:
    get:
      summary: Кем сервис опознал клиента по API-ключу
      responses:
        "200":
          description: Клиент опознан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/documents:
    post:
      summary: Выпустить документ по DOCX-шаблону из запроса
      description: |
        Шаблон и данные приходят в запросе; ответ — сам файл (DOCX или PDF). Каждый запрос,
        в том числе отклонённый, пишется в журнал. Повтор с тем же Idempotency-Key и тем же
        запросом (шаблон, данные, поля) возвращает уже выпущенный документ (200);
        тот же ключ с другим запросом — 409 idempotency_conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/GenerateDocumentForm"
      responses:
        "201":
          description: Документ выпущен
          headers:
            X-Document-Id:
              description: ID документа для GET /v1/documents/{id}
              schema:
                type: string
                format: uuid
            X-Document-SHA256:
              description: SHA-256 файла в hex
              schema:
                type: string
            X-Document-Expires-At:
              description: До какого момента документ хранится (RFC 3339)
              schema:
                type: string
                format: date-time
            Location:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "200":
          description: Повтор запроса — уже выпущенный документ, те же заголовки и файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "400":
          description: |
            Неверный запрос: invalid_form (не multipart, лишнее или повторённое поле),
            invalid_<поле> (обязательное поле, формат, retention_days больше срока проекта),
            invalid_data — данные не подходят шаблону, ошибки по полям в error.details (FieldError).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Ключ идемпотентности уже использован для другого запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Шаблон больше 10 МиБ или данные больше 5 МиБ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            invalid_template — шаблон нельзя использовать, проблемы в error.details (TemplateProblem);
            conversion_failed — LibreOffice не смог превратить документ в PDF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Конвертер PDF недоступен или перегружен (converter_unavailable) — повторите позже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/templates/check:
    post:
      summary: Проверить DOCX-шаблон без генерации
      description: Удобно запускать в CI портала при изменении шаблона.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ template ]
              properties:
                template:
                  type: string
                  format: binary
                  description: Файл .docx, до 10 МиБ
      responses:
        "200":
          description: Шаблон можно использовать
          content:
            application/json:
              schema:
                type: object
                required: [ valid, variables ]
                properties:
                  valid:
                    type: boolean
                    const: true
                  variables:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemplateVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: invalid_template — проблемы шаблона в error.details (TemplateProblem)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/documents/{id}:
    get:
      summary: Метаданные документа своего проекта
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Документ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Документа нет или он другого проекта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Срок хранения документа истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/documents/{id}/file:
    get:
      summary: Скачать файл документа
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Документа нет или он другого проекта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Срок хранения документа истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/login:
    post:
      summary: Вход администратора
      tags: [admin]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                    example: dgs_...
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/logout:
    post:
      summary: Выход (сессия удаляется)
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "204":
          description: Сессия завершена
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/me:
    get:
      summary: Текущий администратор
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Администратор
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/projects:
    get:
      summary: Список проектов
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Проекты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Создать проект
      tags: [admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              additionalProperties: false
              properties:
                code:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{1,49}$"
                  example: procurement
                name:
                  type: string
                  example: Закупки
                retention_days:
                  type: integer
                  minimum: 1
                  maximum: 36500
                  default: 365
                  description: Срок хранения документов проекта — предел для retention_days в запросах
      responses:
        "201":
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Проект с таким кодом уже есть
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/projects/{code}:
    patch:
      summary: Изменить имя или срок хранения проекта
      description: Новый срок действует для документов, выпущенных после изменения.
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                retention_days:
                  type: integer
                  minimum: 1
                  maximum: 36500
      responses:
        "200":
          description: Проект изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Проекта нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/login-info:
    get:
      summary: Нужен ли вход в админку
      description: auth_required=false — демо-стенд с ADMIN_AUTH_DISABLED=true, админка открыта без входа.
      tags: [admin]
      security: []
      responses:
        "200":
          description: Режим входа
          content:
            application/json:
              schema:
                type: object
                required: [auth_required]
                properties:
                  auth_required:
                    type: boolean

  /admin/v1/journal:
    get:
      summary: Журнал запросов на генерацию
      description: |
        Новые первыми, страницами. Следующая страница — с cursor из next_cursor предыдущей
        (null — страниц больше нет). Период: дата (день по Астане; to включает весь день) или RFC 3339.
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - {name: project, in: query, schema: {type: string}}
        - {name: template_name, in: query, schema: {type: string}}
        - {name: external_id, in: query, schema: {type: string}}
        - name: status
          in: query
          description: Можно несколько раз
          schema:
            type: array
            items:
              type: string
              enum: [created, repeated, rejected, failed]
        - {name: from, in: query, schema: {type: string, example: "2026-11-01"}}
        - {name: to, in: query, schema: {type: string, example: "2026-11-17"}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Страница журнала
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/JournalEntry"
                  next_cursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/journal/{id}:
    get:
      summary: Карточка запроса
      description: |
        document_state: available — документ хранится (в document.data входные данные),
        expired — срок истёк (данных уже нет), deleted — удалён по сроку хранения,
        null — документа не было (запрос отклонён или сбой).
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Запись журнала и документ
          content:
            application/json:
              schema:
                type: object
                required: [entry, document_state, document]
                properties:
                  entry:
                    $ref: "#/components/schemas/JournalEntry"
                  document_state:
                    type: [string, "null"]
                    enum: [available, expired, deleted, null]
                  document:
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [id, format, file_size, file_sha256, created_at, expires_at, expired, data]
                        properties:
                          id: {type: string, format: uuid}
                          format: {type: string, enum: [pdf, docx]}
                          file_size: {type: integer}
                          file_sha256: {type: string}
                          created_at: {type: string, format: date-time}
                          expires_at: {type: string, format: date-time}
                          expired: {type: boolean}
                          data:
                            description: Входные данные; null, если срок хранения истёк
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Записи нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/reports:
    get:
      summary: Отчёт за период
      description: Без периода — последние 30 дней по Астане, включая сегодня.
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - {name: project, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, example: "2026-11-01"}}
        - {name: to, in: query, schema: {type: string, example: "2026-11-17"}}
      responses:
        "200":
          description: Отчёт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminSession:
      type: http
      scheme: bearer
      description: Токен из POST /admin/v1/login

  schemas:
    Admin:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    Project:
      type: object
      required: [code, name, retention_days, created_at]
      properties:
        code:
          type: string
        name:
          type: string
        retention_days:
          type: integer
        created_at:
          type: string
          format: date-time

    JournalEntry:
      type: object
      required: [id, created_at, project, project_name, request_id, status, http_status, duration_ms]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        project: {type: string}
        project_name: {type: string}
        request_id: {type: string, description: "X-Request-Id: связывает с логами сервиса и Gotenberg"}
        template_name: {type: [string, "null"]}
        template_sha256: {type: [string, "null"]}
        format: {type: [string, "null"]}
        external_id: {type: [string, "null"]}
        requested_by: {type: [string, "null"]}
        idempotency_key: {type: [string, "null"]}
        status:
          type: string
          enum: [created, repeated, rejected, failed]
        http_status: {type: integer}
        error_code: {type: [string, "null"]}
        error_message: {type: [string, "null"]}
        error_details:
          description: FieldError (invalid_data) или TemplateProblem (invalid_template), null без ошибки
        document_id:
          type: [string, "null"]
          format: uuid
          description: null у отклонённых запросов и после удаления документа по сроку
        result_size: {type: [integer, "null"]}
        duration_ms: {type: integer}

    Report:
      type: object
      required: [from, to, totals, by_project, by_template, by_day]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time, description: Не включая}
        totals:
          type: object
          properties:
            requests: {type: integer}
            created: {type: integer}
            repeated: {type: integer}
            rejected: {type: integer}
            failed: {type: integer}
            avg_duration_ms: {type: integer, description: Среднее время выпуска нового документа}
        by_project:
          type: array
          items:
            type: object
            properties:
              project: {type: string}
              project_name: {type: string}
              created: {type: integer}
              errors: {type: integer}
        by_template:
          type: array
          items:
            type: object
            properties:
              project: {type: string}
              template_name: {type: string, description: Пусто у запросов, отклонённых до разбора полей}
              created: {type: integer}
              errors: {type: integer}
              avg_duration_ms: {type: integer}
        by_day:
          type: array
          items:
            type: object
            properties:
              day: {type: string, format: date, description: День по Астане}
              created: {type: integer}
              errors: {type: integer}

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Путь до поля в данных; [n] — элемент списка
          example: lots[0].amount
        message:
          type: string
          example: got string, want number

    GenerateDocumentForm:
      type: object
      required: [ template, data, format, template_name, external_id, requested_by, retention_days ]
      properties:
        template:
          type: string
          format: binary
          description: DOCX-шаблон с метками {{ }}, до 10 МиБ
        data:
          type: string
          description: JSON-объект с данными (полем или файлом), до 5 МиБ
        format:
          type: string
          enum: [ docx, pdf ]
        template_name:
          type: string
          maxLength: 200
          description: Как шаблон называет портал, например opening_protocol; по нему строятся отчёты
        external_id:
          type: string
          maxLength: 255
          description: Сущность в портале, ради которой выпущен документ, например lot:209092
        requested_by:
          type: string
          maxLength: 255
          description: ID пользователя в портале — не ФИО и не ИИН
        retention_days:
          type: integer
          minimum: 1
          description: Срок хранения в днях, не больше срока хранения проекта

    TemplateProblem:
      type: object
      required: [ part, context, message ]
      properties:
        part:
          type: string
          description: Основной текст, верхний или нижний колонтитул
        context:
          type: string
          description: Текст абзаца рядом с проблемной меткой
        message:
          type: string

    TemplateVariable:
      type: object
      required: [ path, usage ]
      properties:
        path:
          type: string
          description: Путь в данных; [] — элемент списка, например lots[].name
          example: lots[].name
        usage:
          type: array
          items:
            type: string
            enum: [ value, each, if ]
        filters:
          type: array
          items:
            type: string
          example: [ money ]

    Document:
      type: object
      required: [ id, template_name, template_sha256, format, external_id, requested_by, file_sha256, file_size, created_at, expires_at ]
      properties:
        id:
          type: string
          format: uuid
        template_name:
          type: string
        template_sha256:
          type: string
          description: SHA-256 шаблона, по которому выпущен документ
        format:
          type: string
          enum: [ pdf, docx ]
        external_id:
          type: [ string, "null" ]
        requested_by:
          type: [ string, "null" ]
        file_sha256:
          type: string
        file_size:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    WhoAmI:
      type: object
      required: [id, name, project]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Портал закупок
        project:
          type: string
          example: procurement

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: unauthorized
            message:
              type: string
            details:
              description: |
                Подробности, если есть: FieldError по полям данных (invalid_data)
                или TemplateProblem по меткам шаблона (invalid_template)
              oneOf:
                - type: array
                  items:
                    $ref: "#/components/schemas/FieldError"
                - type: array
                  items:
                    $ref: "#/components/schemas/TemplateProblem"

  parameters:
    DocumentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нет учётных данных или они недействительны
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
