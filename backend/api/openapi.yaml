openapi: 3.1.0
info:
  title: DocGen API
  version: 0.1.0
  description: Сервис генерации документов по шаблонам.

paths:
  /healthz:
    get:
      summary: Проверка живости сервиса
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/whoami:
    get:
      summary: Кем сервис опознал клиента по API-ключу
      responses:
        "200":
          description: Клиент опознан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/templates:
    get:
      summary: Активные шаблоны проекта, которому принадлежит API-ключ
      description: |
        Проект определяется только по ключу. Черновики и архивные шаблоны не показываются.
        Пустой каталог — пустой массив.
      responses:
        "200":
          description: Каталог шаблонов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/templates/{code}/schema:
    get:
      summary: Схема данных шаблона для проверки на стороне портала
      description: |
        Без version — схема активной версии. Шаблоны чужих проектов, черновики и архив не находятся.
        locale обязателен, только если у кода несколько локалей (иначе 400 invalid_locale со списком).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: opening_protocol
        - name: locale
          in: query
          description: kz принимается как устаревшее написание kk
          schema:
            type: string
            enum: [ru, kk, kz, bilingual]
        - name: version
          in: query
          description: Номер опубликованной версии, если портал зафиксировал версию
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Схема версии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalTemplateSchema"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Шаблон или версия не найдены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/documents:
    post:
      summary: Выпустить документ по DOCX-шаблону из запроса
      description: |
        Шаблон и данные приходят в запросе; ответ — сам файл (DOCX или PDF). Каждый запрос,
        в том числе отклонённый, пишется в журнал. Повтор с тем же Idempotency-Key и тем же
        запросом (шаблон, данные, поля) возвращает уже выпущенный документ (200);
        тот же ключ с другим запросом — 409 idempotency_conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/GenerateDocumentForm"
      responses:
        "201":
          description: Документ выпущен
          headers:
            X-Document-Id:
              description: ID документа для GET /v1/documents/{id}
              schema:
                type: string
                format: uuid
            X-Document-SHA256:
              description: SHA-256 файла в hex
              schema:
                type: string
            X-Document-Expires-At:
              description: До какого момента документ хранится (RFC 3339)
              schema:
                type: string
                format: date-time
            Location:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "200":
          description: Повтор запроса — уже выпущенный документ, те же заголовки и файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "400":
          description: |
            Неверный запрос: invalid_form (не multipart, лишнее или повторённое поле),
            invalid_<поле> (обязательное поле, формат, retention_days больше срока проекта),
            invalid_data — данные не подходят шаблону, ошибки по полям в error.details (FieldError).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Ключ идемпотентности уже использован для другого запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Шаблон больше 10 МиБ или данные больше 5 МиБ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            invalid_template — шаблон нельзя использовать, проблемы в error.details (TemplateProblem);
            conversion_failed — LibreOffice не смог превратить документ в PDF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Конвертер PDF недоступен или перегружен (converter_unavailable) — повторите позже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/templates/check:
    post:
      summary: Проверить DOCX-шаблон без генерации
      description: Удобно запускать в CI портала при изменении шаблона.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ template ]
              properties:
                template:
                  type: string
                  format: binary
                  description: Файл .docx, до 10 МиБ
      responses:
        "200":
          description: Шаблон можно использовать
          content:
            application/json:
              schema:
                type: object
                required: [ valid, variables ]
                properties:
                  valid:
                    type: boolean
                    const: true
                  variables:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemplateVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: invalid_template — проблемы шаблона в error.details (TemplateProblem)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/documents/{id}:
    get:
      summary: Метаданные документа своего проекта
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Документ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Документа нет или он другого проекта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Срок хранения документа истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/documents/{id}/file:
    get:
      summary: Скачать файл документа
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Документа нет или он другого проекта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Срок хранения документа истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/verify/{public_id}:
    get:
      summary: Публичная проверка подлинности документа
      description: |
        Сюда ведёт QR-код документа. Ключ не нужен. Ответ подтверждает, что документ выпущен
        сервисом, и не раскрывает его содержимое. Браузеру (`Accept` содержит `text/html`)
        отвечает страницей проверки с теми же статусами, остальным — JSON.
      security: []
      parameters:
        - name: public_id
          in: path
          required: true
          description: Идентификатор из колонтитула документа (32 hex-символа)
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
      responses:
        "200":
          description: Документ подлинный
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
            text/html:
              schema:
                type: string
        "404":
          description: Документа нет (в том числе неверный формат идентификатора)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Срок хранения документа истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/login:
    post:
      summary: Вход администратора
      tags: [admin]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                    example: dgs_...
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/logout:
    post:
      summary: Выход (сессия удаляется)
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "204":
          description: Сессия завершена
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/me:
    get:
      summary: Текущий администратор
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Администратор
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/projects:
    get:
      summary: Список проектов
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Проекты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Создать проект
      tags: [admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              additionalProperties: false
              properties:
                code:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{1,49}$"
                  example: procurement
                name:
                  type: string
                  example: Закупки
      responses:
        "201":
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Проект с таким кодом уже есть
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/templates:
    get:
      summary: Список шаблонов
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      parameters:
        - name: project
          in: query
          required: false
          description: Код проекта; без параметра — все шаблоны
          schema:
            type: string
      responses:
        "200":
          description: Шаблоны
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Создать шаблон (статус draft)
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ project, code, locale, name, engine, retention_days ]
              additionalProperties: false
              properties:
                project:
                  type: string
                  example: procurement
                code:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{1,99}$"
                  example: opening_protocol
                locale:
                  type: string
                  enum: [ ru, kk, bilingual ]
                name:
                  type: string
                  example: Протокол вскрытия
                engine:
                  type: string
                  enum: [ docx, html ]
                retention_days:
                  type: integer
                  minimum: 1
                  example: 1825
      responses:
        "201":
          description: Шаблон создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Шаблон с таким проектом, кодом и языком уже есть
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/v1/templates/{id}:
    get:
      summary: Шаблон по ID
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: ID шаблона
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Шаблон
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Шаблон не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/templates/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        description: ID шаблона
        schema:
          type: string
          format: uuid
    get:
      summary: Версии шаблона (новые первыми)
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      responses:
        "200":
          description: Версии
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Загрузить версию (новый черновик или замена существующего)
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file, schema ]
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл шаблона (.html или .docx), до 10 МиБ
                schema:
                  type: string
                  description: |
                    JSON Schema данных шаблона (draft 2020-12 по умолчанию), корень — "type": "object".
                    Внешние $ref запрещены: определения держите внутри схемы в $defs.
                    format проверяется; кроме стандартных есть kz-iin и kz-bin (12 цифр и контрольная цифра).
                test_data:
                  type: string
                  description: |
                    Тестовые данные для предпросмотра (JSON), необязательно. Должны подходить под схему,
                    иначе 400 invalid_test_data с ошибками по полям в error.details.
                expected_draft:
                  type: string
                  description: |
                    Защита от затирания чужих правок, необязательно. `none` — клиент начинал правку,
                    когда черновика не было; иначе `updated_at` черновика, который он редактировал
                    (как пришёл в TemplateVersion). Если черновик с тех пор появился, заменён или
                    опубликован — 409 draft_changed. Без поля черновик заменяется без проверки.
      responses:
        "201":
          description: Создан новый черновик
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "200":
          description: Существующий черновик заменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Шаблон не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Шаблон в архиве (template_archived) или черновик изменился (draft_changed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/versions/{id}/publish:
    post:
      summary: Опубликовать черновик версии (после этого версия неизменяема)
      description: |
        Схема сравнивается с базовой версией (активной, а если её нет — предыдущей опубликованной).
        При ломающих изменениях ответ 409 breaking_changes с изменениями в error.details;
        повторите запрос с confirm_breaking=true, чтобы опубликовать осознанно.
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID версии
          schema:
            type: string
            format: uuid
        - name: confirm_breaking
          in: query
          description: Опубликовать, несмотря на ломающие изменения схемы
          schema:
            type: boolean
      responses:
        "200":
          description: Версия опубликована
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Версия не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Версия уже опубликована, шаблон в архиве или схема ломает совместимость (breaking_changes, details — SchemaDiff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/versions/{id}/diff:
    get:
      summary: Изменения схемы версии относительно базовой (что увидят порталы)
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID версии
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Изменения схемы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDiff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Версия не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/versions/{id}/preview:
    get:
      summary: PDF версии, отрисованной на её тестовых данных
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: ID версии
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Версия не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Нет тестовых данных (no_test_data), движок не html (preview_not_supported) или шаблон не отрисовался (render_failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/versions/{id}/file:
    get:
      summary: Скачать файл шаблона версии
      description: |
        Файл сверяется с SHA-256 версии. Всегда `attachment` и `application/octet-stream`,
        чтобы HTML шаблона не открылся страницей на адресе админки.
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: ID версии
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Файл шаблона (`<code>-<locale>-v<N>.<engine>`)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Версия не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/templates/{id}/activate:
    post:
      summary: Сделать опубликованную версию активной (так же выполняется откат)
      description: |
        Активация меняет то, что получают порталы, поэтому схема сравнивается с текущей активной версией.
        Ломающие изменения (в том числе при откате) — 409 breaking_changes, повтор с confirm_breaking=true.
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID шаблона
          schema:
            type: string
            format: uuid
        - name: confirm_breaking
          in: query
          description: Активировать, несмотря на ломающие изменения схемы
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id]
              additionalProperties: false
              properties:
                version_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Версия активирована, шаблон в статусе active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Шаблон или версия не найдены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Версия не опубликована, шаблон в архиве или схема ломает совместимость (breaking_changes, details — SchemaDiff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/templates/{id}/archive:
    post:
      summary: Перевести шаблон в архив
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID шаблона
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Шаблон в архиве
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Шаблон не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Шаблон уже в архиве
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminSession:
      type: http
      scheme: bearer
      description: Токен из POST /admin/v1/login

  schemas:
    Admin:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    Project:
      type: object
      required: [code, name, created_at]
      properties:
        code:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    Template:
      type: object
      required: [id, project, code, locale, name, engine, status, retention_days, active_version_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project:
          type: string
        code:
          type: string
        locale:
          type: string
          enum: [ru, kk, bilingual]
        name:
          type: string
        engine:
          type: string
          enum: [docx, html]
        status:
          type: string
          enum: [draft, active, archived]
        retention_days:
          type: integer
        active_version_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TemplateVersion:
      type: object
      required: [ id, template_id, version, status, file_sha256, data_schema, test_data, created_by, created_at, updated_at, published_by, published_at ]
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          type: string
          enum: [ draft, published ]
        file_sha256:
          type: string
          description: SHA-256 файла в hex
        data_schema:
          type: object
        test_data:
          type: [ object, array, string, number, boolean, "null" ]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_by:
          type: [ string, "null" ]
        published_at:
          type: [ string, "null" ]
          format: date-time

    PortalTemplate:
      type: object
      required: [code, locale, name, engine, active_version]
      properties:
        code:
          type: string
          example: opening_protocol
        locale:
          type: string
          enum: [ru, kk, bilingual]
        name:
          type: string
          example: Протокол вскрытия
        engine:
          type: string
          enum: [docx, html]
        active_version:
          type: integer
          description: Номер версии, по которой генерируется документ, если версия не указана
          example: 2

    PortalTemplateSchema:
      type: object
      required: [code, locale, version, schema]
      properties:
        code:
          type: string
          example: opening_protocol
        locale:
          type: string
          enum: [ru, kk, bilingual]
        version:
          type: integer
          example: 2
        schema:
          type: object
          description: JSON Schema данных этой версии

    SchemaDiff:
      type: object
      required: [base_version, breaking, changes]
      properties:
        base_version:
          type: [integer, "null"]
          description: С какой версией сравнивали; null — первая публикация
        breaking:
          type: boolean
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SchemaChange"

    SchemaChange:
      type: object
      required: [path, kind, breaking, message]
      properties:
        path:
          type: string
          description: Путь к полю, [] — элемент массива
          example: lots[].amount
        kind:
          type: string
          enum: [field_added, field_removed, became_required, type_changed, enum_narrowed, additional_properties_closed, constraint_changed]
        breaking:
          type: boolean
        message:
          type: string

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON Pointer до поля в данных
          example: /lots/0/amount
        message:
          type: string
          example: got string, want number

    GenerateDocumentForm:
      type: object
      required: [ template, data, format, template_name, external_id, requested_by, retention_days ]
      properties:
        template:
          type: string
          format: binary
          description: DOCX-шаблон с метками {{ }}, до 10 МиБ
        data:
          type: string
          description: JSON-объект с данными (полем или файлом), до 5 МиБ
        format:
          type: string
          enum: [ docx, pdf ]
        template_name:
          type: string
          maxLength: 200
          description: Как шаблон называет портал, например opening_protocol; по нему строятся отчёты
        external_id:
          type: string
          maxLength: 255
          description: Сущность в портале, ради которой выпущен документ, например lot:209092
        requested_by:
          type: string
          maxLength: 255
          description: ID пользователя в портале — не ФИО и не ИИН
        retention_days:
          type: integer
          minimum: 1
          description: Срок хранения в днях, не больше срока хранения проекта

    TemplateProblem:
      type: object
      required: [ part, context, message ]
      properties:
        part:
          type: string
          description: Основной текст, верхний или нижний колонтитул
        context:
          type: string
          description: Текст абзаца рядом с проблемной меткой
        message:
          type: string

    TemplateVariable:
      type: object
      required: [ path, usage ]
      properties:
        path:
          type: string
          description: Путь в данных; [] — элемент списка, например lots[].name
          example: lots[].name
        usage:
          type: array
          items:
            type: string
            enum: [ value, each, if ]
        filters:
          type: array
          items:
            type: string
          example: [ money ]

    Document:
      type: object
      required: [ id, template_name, template_sha256, format, external_id, requested_by, file_sha256, file_size, created_at, expires_at ]
      properties:
        id:
          type: string
          format: uuid
        template_name:
          type: string
        template_sha256:
          type: [ string, "null" ]
          description: SHA-256 шаблона, по которому выпущен документ (null у документов старого реестра)
        format:
          type: string
          enum: [ pdf, docx ]
        external_id:
          type: [ string, "null" ]
        requested_by:
          type: [ string, "null" ]
        file_sha256:
          type: string
        file_size:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    VerifyResult:
      type: object
      required: [public_id, valid, template_name, project_name, format, file_sha256, file_size, created_at, expires_at, signatures]
      properties:
        public_id:
          type: string
        valid:
          type: boolean
          const: true
        template_name:
          type: string
        project_name:
          type: string
          description: Проект (портал), для которого выпущен документ
        format:
          type: string
          enum: [pdf, docx]
        file_sha256:
          type: string
          description: SHA-256 файла в hex, чтобы сверить свою копию
        file_size:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        signatures:
          type: array
          description: Подписанты; пока подписи не принимаются, список пуст
          items:
            type: object

    WhoAmI:
      type: object
      required: [id, name, project]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Портал закупок
        project:
          type: string
          example: procurement

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: unauthorized
            message:
              type: string
            details:
              description: |
                Подробности, если есть: массив FieldError (ошибки по полям)
                или SchemaDiff (breaking_changes при публикации)
              oneOf:
                - type: array
                  items:
                    $ref: "#/components/schemas/FieldError"
                - $ref: "#/components/schemas/SchemaDiff"

  parameters:
    DocumentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нет учётных данных или они недействительны
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
