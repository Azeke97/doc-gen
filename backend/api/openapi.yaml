openapi: 3.1.0
info:
  title: DocGen API
  version: 0.1.0
  description: Сервис генерации документов по шаблонам.

paths:
  /healthz:
    get:
      summary: Проверка живости сервиса
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/whoami:
    get:
      summary: Кем сервис опознал клиента по API-ключу
      responses:
        "200":
          description: Клиент опознан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/documents:
    post:
      summary: Выпустить документ по DOCX-шаблону из запроса
      description: |
        Шаблон и данные приходят в запросе; ответ — сам файл (DOCX или PDF). Каждый запрос,
        в том числе отклонённый, пишется в журнал. Повтор с тем же Idempotency-Key и тем же
        запросом (шаблон, данные, поля) возвращает уже выпущенный документ (200);
        тот же ключ с другим запросом — 409 idempotency_conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/GenerateDocumentForm"
      responses:
        "201":
          description: Документ выпущен
          headers:
            X-Document-Id:
              description: ID документа для GET /v1/documents/{id}
              schema:
                type: string
                format: uuid
            X-Document-SHA256:
              description: SHA-256 файла в hex
              schema:
                type: string
            X-Document-Expires-At:
              description: До какого момента документ хранится (RFC 3339)
              schema:
                type: string
                format: date-time
            Location:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "200":
          description: Повтор запроса — уже выпущенный документ, те же заголовки и файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "400":
          description: |
            Неверный запрос: invalid_form (не multipart, лишнее или повторённое поле),
            invalid_<поле> (обязательное поле, формат, retention_days больше срока проекта),
            invalid_data — данные не подходят шаблону, ошибки по полям в error.details (FieldError).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Ключ идемпотентности уже использован для другого запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Шаблон больше 10 МиБ или данные больше 5 МиБ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            invalid_template — шаблон нельзя использовать, проблемы в error.details (TemplateProblem);
            conversion_failed — LibreOffice не смог превратить документ в PDF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Конвертер PDF недоступен или перегружен (converter_unavailable) — повторите позже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/templates/check:
    post:
      summary: Проверить DOCX-шаблон без генерации
      description: Удобно запускать в CI портала при изменении шаблона.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ template ]
              properties:
                template:
                  type: string
                  format: binary
                  description: Файл .docx, до 10 МиБ
      responses:
        "200":
          description: Шаблон можно использовать
          content:
            application/json:
              schema:
                type: object
                required: [ valid, variables ]
                properties:
                  valid:
                    type: boolean
                    const: true
                  variables:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemplateVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: invalid_template — проблемы шаблона в error.details (TemplateProblem)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/documents/{id}:
    get:
      summary: Метаданные документа своего проекта
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Документ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Документа нет или он другого проекта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Срок хранения документа истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/documents/{id}/file:
    get:
      summary: Скачать файл документа
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Документа нет или он другого проекта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Срок хранения документа истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/login:
    post:
      summary: Вход администратора
      tags: [admin]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                    example: dgs_...
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/logout:
    post:
      summary: Выход (сессия удаляется)
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "204":
          description: Сессия завершена
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/me:
    get:
      summary: Текущий администратор
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Администратор
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/projects:
    get:
      summary: Список проектов
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Проекты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Создать проект
      tags: [admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              additionalProperties: false
              properties:
                code:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{1,49}$"
                  example: procurement
                name:
                  type: string
                  example: Закупки
      responses:
        "201":
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Проект с таким кодом уже есть
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminSession:
      type: http
      scheme: bearer
      description: Токен из POST /admin/v1/login

  schemas:
    Admin:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    Project:
      type: object
      required: [code, name, created_at]
      properties:
        code:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Путь до поля в данных; [n] — элемент списка
          example: lots[0].amount
        message:
          type: string
          example: got string, want number

    GenerateDocumentForm:
      type: object
      required: [ template, data, format, template_name, external_id, requested_by, retention_days ]
      properties:
        template:
          type: string
          format: binary
          description: DOCX-шаблон с метками {{ }}, до 10 МиБ
        data:
          type: string
          description: JSON-объект с данными (полем или файлом), до 5 МиБ
        format:
          type: string
          enum: [ docx, pdf ]
        template_name:
          type: string
          maxLength: 200
          description: Как шаблон называет портал, например opening_protocol; по нему строятся отчёты
        external_id:
          type: string
          maxLength: 255
          description: Сущность в портале, ради которой выпущен документ, например lot:209092
        requested_by:
          type: string
          maxLength: 255
          description: ID пользователя в портале — не ФИО и не ИИН
        retention_days:
          type: integer
          minimum: 1
          description: Срок хранения в днях, не больше срока хранения проекта

    TemplateProblem:
      type: object
      required: [ part, context, message ]
      properties:
        part:
          type: string
          description: Основной текст, верхний или нижний колонтитул
        context:
          type: string
          description: Текст абзаца рядом с проблемной меткой
        message:
          type: string

    TemplateVariable:
      type: object
      required: [ path, usage ]
      properties:
        path:
          type: string
          description: Путь в данных; [] — элемент списка, например lots[].name
          example: lots[].name
        usage:
          type: array
          items:
            type: string
            enum: [ value, each, if ]
        filters:
          type: array
          items:
            type: string
          example: [ money ]

    Document:
      type: object
      required: [ id, template_name, template_sha256, format, external_id, requested_by, file_sha256, file_size, created_at, expires_at ]
      properties:
        id:
          type: string
          format: uuid
        template_name:
          type: string
        template_sha256:
          type: string
          description: SHA-256 шаблона, по которому выпущен документ
        format:
          type: string
          enum: [ pdf, docx ]
        external_id:
          type: [ string, "null" ]
        requested_by:
          type: [ string, "null" ]
        file_sha256:
          type: string
        file_size:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    WhoAmI:
      type: object
      required: [id, name, project]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Портал закупок
        project:
          type: string
          example: procurement

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: unauthorized
            message:
              type: string
            details:
              description: |
                Подробности, если есть: FieldError по полям данных (invalid_data)
                или TemplateProblem по меткам шаблона (invalid_template)
              oneOf:
                - type: array
                  items:
                    $ref: "#/components/schemas/FieldError"
                - type: array
                  items:
                    $ref: "#/components/schemas/TemplateProblem"

  parameters:
    DocumentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нет учётных данных или они недействительны
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
