openapi: 3.1.0
info:
  title: DocGen API
  version: 0.1.0
  description: Сервис генерации документов по шаблонам.

paths:
  /healthz:
    get:
      summary: Проверка живости сервиса
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/whoami:
    get:
      summary: Кем сервис опознал клиента по API-ключу
      responses:
        "200":
          description: Клиент опознан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/templates:
    get:
      summary: Активные шаблоны проекта, которому принадлежит API-ключ
      description: |
        Проект определяется только по ключу. Черновики и архивные шаблоны не показываются.
        Пустой каталог — пустой массив.
      responses:
        "200":
          description: Каталог шаблонов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/templates/{code}/schema:
    get:
      summary: Схема данных шаблона для проверки на стороне портала
      description: |
        Без version — схема активной версии. Шаблоны чужих проектов, черновики и архив не находятся.
        locale обязателен, только если у кода несколько локалей (иначе 400 invalid_locale со списком).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: opening_protocol
        - name: locale
          in: query
          description: kz принимается как устаревшее написание kk
          schema:
            type: string
            enum: [ru, kk, kz, bilingual]
        - name: version
          in: query
          description: Номер опубликованной версии, если портал зафиксировал версию
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Схема версии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalTemplateSchema"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Шаблон или версия не найдены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/login:
    post:
      summary: Вход администратора
      tags: [admin]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                    example: dgs_...
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/logout:
    post:
      summary: Выход (сессия удаляется)
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "204":
          description: Сессия завершена
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/me:
    get:
      summary: Текущий администратор
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Администратор
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/projects:
    get:
      summary: Список проектов
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Проекты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Создать проект
      tags: [admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              additionalProperties: false
              properties:
                code:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{1,49}$"
                  example: procurement
                name:
                  type: string
                  example: Закупки
      responses:
        "201":
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Проект с таким кодом уже есть
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/templates:
    get:
      summary: Список шаблонов
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      parameters:
        - name: project
          in: query
          required: false
          description: Код проекта; без параметра — все шаблоны
          schema:
            type: string
      responses:
        "200":
          description: Шаблоны
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Создать шаблон (статус draft)
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ project, code, locale, name, engine, retention_days ]
              additionalProperties: false
              properties:
                project:
                  type: string
                  example: procurement
                code:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{1,99}$"
                  example: opening_protocol
                locale:
                  type: string
                  enum: [ ru, kk, bilingual ]
                name:
                  type: string
                  example: Протокол вскрытия
                engine:
                  type: string
                  enum: [ docx, html ]
                retention_days:
                  type: integer
                  minimum: 1
                  example: 1825
      responses:
        "201":
          description: Шаблон создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Шаблон с таким проектом, кодом и языком уже есть
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/v1/templates/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        description: ID шаблона
        schema:
          type: string
          format: uuid
    get:
      summary: Версии шаблона (новые первыми)
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      responses:
        "200":
          description: Версии
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Загрузить версию (новый черновик или замена существующего)
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file, schema ]
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл шаблона (.html или .docx), до 10 МиБ
                schema:
                  type: string
                  description: |
                    JSON Schema данных шаблона (draft 2020-12 по умолчанию), корень — "type": "object".
                    Внешние $ref запрещены: определения держите внутри схемы в $defs.
                    format проверяется; кроме стандартных есть kz-iin и kz-bin (12 цифр и контрольная цифра).
                test_data:
                  type: string
                  description: |
                    Тестовые данные для предпросмотра (JSON), необязательно. Должны подходить под схему,
                    иначе 400 invalid_test_data с ошибками по полям в error.details.
      responses:
        "201":
          description: Создан новый черновик
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "200":
          description: Существующий черновик заменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Шаблон не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Шаблон в архиве
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/versions/{id}/publish:
    post:
      summary: Опубликовать черновик версии (после этого версия неизменяема)
      description: |
        Схема сравнивается с базовой версией (активной, а если её нет — предыдущей опубликованной).
        При ломающих изменениях ответ 409 breaking_changes с изменениями в error.details;
        повторите запрос с confirm_breaking=true, чтобы опубликовать осознанно.
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID версии
          schema:
            type: string
            format: uuid
        - name: confirm_breaking
          in: query
          description: Опубликовать, несмотря на ломающие изменения схемы
          schema:
            type: boolean
      responses:
        "200":
          description: Версия опубликована
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Версия не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Версия уже опубликована, шаблон в архиве или схема ломает совместимость (breaking_changes, details — SchemaDiff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/versions/{id}/diff:
    get:
      summary: Изменения схемы версии относительно базовой (что увидят порталы)
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID версии
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Изменения схемы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDiff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Версия не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/templates/{id}/activate:
    post:
      summary: Сделать опубликованную версию активной (так же выполняется откат)
      description: |
        Активация меняет то, что получают порталы, поэтому схема сравнивается с текущей активной версией.
        Ломающие изменения (в том числе при откате) — 409 breaking_changes, повтор с confirm_breaking=true.
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID шаблона
          schema:
            type: string
            format: uuid
        - name: confirm_breaking
          in: query
          description: Активировать, несмотря на ломающие изменения схемы
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id]
              additionalProperties: false
              properties:
                version_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Версия активирована, шаблон в статусе active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Шаблон или версия не найдены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Версия не опубликована, шаблон в архиве или схема ломает совместимость (breaking_changes, details — SchemaDiff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/templates/{id}/archive:
    post:
      summary: Перевести шаблон в архив
      tags: [admin]
      security:
        - AdminSession: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID шаблона
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Шаблон в архиве
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Шаблон не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Шаблон уже в архиве
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminSession:
      type: http
      scheme: bearer
      description: Токен из POST /admin/v1/login

  schemas:
    Admin:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    Project:
      type: object
      required: [code, name, created_at]
      properties:
        code:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    Template:
      type: object
      required: [id, project, code, locale, name, engine, status, retention_days, active_version_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project:
          type: string
        code:
          type: string
        locale:
          type: string
          enum: [ru, kk, bilingual]
        name:
          type: string
        engine:
          type: string
          enum: [docx, html]
        status:
          type: string
          enum: [draft, active, archived]
        retention_days:
          type: integer
        active_version_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TemplateVersion:
      type: object
      required: [ id, template_id, version, status, file_sha256, data_schema, test_data, created_by, created_at, updated_at, published_by, published_at ]
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          type: string
          enum: [ draft, published ]
        file_sha256:
          type: string
          description: SHA-256 файла в hex
        data_schema:
          type: object
        test_data:
          type: [ object, array, string, number, boolean, "null" ]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_by:
          type: [ string, "null" ]
        published_at:
          type: [ string, "null" ]
          format: date-time

    PortalTemplate:
      type: object
      required: [code, locale, name, engine, active_version]
      properties:
        code:
          type: string
          example: opening_protocol
        locale:
          type: string
          enum: [ru, kk, bilingual]
        name:
          type: string
          example: Протокол вскрытия
        engine:
          type: string
          enum: [docx, html]
        active_version:
          type: integer
          description: Номер версии, по которой генерируется документ, если версия не указана
          example: 2

    PortalTemplateSchema:
      type: object
      required: [code, locale, version, schema]
      properties:
        code:
          type: string
          example: opening_protocol
        locale:
          type: string
          enum: [ru, kk, bilingual]
        version:
          type: integer
          example: 2
        schema:
          type: object
          description: JSON Schema данных этой версии

    SchemaDiff:
      type: object
      required: [base_version, breaking, changes]
      properties:
        base_version:
          type: [integer, "null"]
          description: С какой версией сравнивали; null — первая публикация
        breaking:
          type: boolean
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SchemaChange"

    SchemaChange:
      type: object
      required: [path, kind, breaking, message]
      properties:
        path:
          type: string
          description: Путь к полю, [] — элемент массива
          example: lots[].amount
        kind:
          type: string
          enum: [field_added, field_removed, became_required, type_changed, enum_narrowed, additional_properties_closed, constraint_changed]
        breaking:
          type: boolean
        message:
          type: string

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON Pointer до поля в данных
          example: /lots/0/amount
        message:
          type: string
          example: got string, want number

    WhoAmI:
      type: object
      required: [id, name, project]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Портал закупок
        project:
          type: string
          example: procurement

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: unauthorized
            message:
              type: string
            details:
              description: |
                Подробности, если есть: массив FieldError (ошибки по полям)
                или SchemaDiff (breaking_changes при публикации)
              oneOf:
                - type: array
                  items:
                    $ref: "#/components/schemas/FieldError"
                - $ref: "#/components/schemas/SchemaDiff"

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нет учётных данных или они недействительны
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
