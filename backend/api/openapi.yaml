openapi: 3.1.0
info:
  title: DocGen API
  version: 0.1.0
  description: Сервис генерации документов по шаблонам.

paths:
  /healthz:
    get:
      summary: Проверка живости сервиса
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/whoami:
    get:
      summary: Кем сервис опознал клиента по API-ключу
      responses:
        "200":
          description: Клиент опознан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/login:
    post:
      summary: Вход администратора
      tags: [admin]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                    example: dgs_...
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/logout:
    post:
      summary: Выход (сессия удаляется)
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "204":
          description: Сессия завершена
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/me:
    get:
      summary: Текущий администратор
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Администратор
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/projects:
    get:
      summary: Список проектов
      tags: [admin]
      security:
        - AdminSession: []
      responses:
        "200":
          description: Проекты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Создать проект
      tags: [admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              additionalProperties: false
              properties:
                code:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{1,49}$"
                  example: procurement
                name:
                  type: string
                  example: Закупки
      responses:
        "201":
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Проект с таким кодом уже есть
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/v1/templates:
    get:
      summary: Список шаблонов
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      parameters:
        - name: project
          in: query
          required: false
          description: Код проекта; без параметра — все шаблоны
          schema:
            type: string
      responses:
        "200":
          description: Шаблоны
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Создать шаблон (статус draft)
      tags: [ admin ]
      security:
        - AdminSession: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ project, code, locale, name, engine, retention_days ]
              additionalProperties: false
              properties:
                project:
                  type: string
                  example: procurement
                code:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{1,99}$"
                  example: opening_protocol
                locale:
                  type: string
                  enum: [ ru, kk, bilingual ]
                name:
                  type: string
                  example: Протокол вскрытия
                engine:
                  type: string
                  enum: [ docx, html ]
                retention_days:
                  type: integer
                  minimum: 1
                  example: 1825
      responses:
        "201":
          description: Шаблон создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Шаблон с таким проектом, кодом и языком уже есть
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminSession:
      type: http
      scheme: bearer
      description: Токен из POST /admin/v1/login

  schemas:
    Admin:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    Project:
      type: object
      required: [code, name, created_at]
      properties:
        code:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    Template:
      type: object
      required: [id, project, code, locale, name, engine, status, retention_days, active_version_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project:
          type: string
        code:
          type: string
        locale:
          type: string
          enum: [ru, kk, bilingual]
        name:
          type: string
        engine:
          type: string
          enum: [docx, html]
        status:
          type: string
          enum: [draft, active, archived]
        retention_days:
          type: integer
        active_version_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WhoAmI:
      type: object
      required: [id, name, project]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Портал закупок
        project:
          type: string
          example: procurement

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: unauthorized
            message:
              type: string

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нет учётных данных или они недействительны
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
